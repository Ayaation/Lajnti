
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رفع ملفات الامتحانات | LAJNA</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f7f8;
      color: #173b43;
    }
    header {
      background: #164d59;
      color: white;
      padding: 25px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px #00000012;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }
    input { border: 1px solid #cbd5d8; }
    button {
      background: #176d7b;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    #message {
      margin-top: 18px;
      white-space: pre-wrap;
    }
    a { color: #176d7b; }
  </style>
</head>
<body>

<header>
  <h1>LAJNA | لجنة</h1>
  <p>رفع ملفات لجان الامتحانات</p>
</header>

<main>
  <h2>رفع ملف Excel</h2>
  <p id="accountStatus">جاري التحقق من الحساب...</p>

  <form id="uploadForm" hidden>
    <label for="excelFile">اختيار ملف الامتحان</label>
    <input
      id="excelFile"
      type="file"
      accept=".xlsx,.xls"
      required
    >
    <p>الملفات المسموحة: XLSX أو XLS — بحد أقصى 1 MB.</p>
    <button id="uploadButton" type="submit">
      رفع الملف
    </button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <p><a href="./">العودة إلى الصفحة الرئيسية</a></p>
</main>

<script type="module">
import { createClient } from
  'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://agaklcxooywqxqhmvhfe.supabase.co',
  'sb_publishable_VPwiw3f5KE_AXEjqwJWclA_nYCjdN0c'
);

const $ = id => document.getElementById(id);
let currentUser = null;

function showMessage(text) {
  $('message').textContent = text;
}

async function checkAccess() {
  const { data: { user }, error } =
    await supabase.auth.getUser();

  if (error || !user) {
    $('accountStatus').textContent =
      'يجب تسجيل الدخول أولًا من صفحة الأعضاء.';
    return;
  }

  const { data: admin, error: adminError } = await supabase
    .from('admins')
    .select('user_id')
    .eq('user_id', user.id)
    .maybeSingle();

  if (adminError) {
    $('accountStatus').textContent =
      'تعذر التحقق من الصلاحيات.';
    return;
  }

  let allowed = Boolean(admin);

  if (!allowed) {
    const { data: member, error: memberError } = await supabase
      .from('control_members')
      .select('status')
      .eq('user_id', user.id)
      .maybeSingle();

    if (memberError) {
      $('accountStatus').textContent =
        'تعذر التحقق من عضوية الكنترول.';
      return;
    }

    allowed = member?.status === 'approved';
  }

  if (!allowed) {
    $('accountStatus').textContent =
      'حسابك غير معتمد لرفع ملفات الامتحانات.';
    return;
  }

  currentUser = user;
  $('accountStatus').textContent =
    'تم التحقق من الحساب. يمكنك رفع ملف Excel.';
  $('uploadForm').hidden = false;
}

$('uploadForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (!currentUser) {
    showMessage('يجب تسجيل الدخول بحساب معتمد.');
    return;
  }

  const file = $('excelFile').files[0];

  if (!file) {
    showMessage('اختاري ملف Excel أولًا.');
    return;
  }

  const extension = file.name.split('.').pop().toLowerCase();
  const allowedTypes = {
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    xls: 'application/vnd.ms-excel'
  };

  if (!allowedTypes[extension]) {
    showMessage('نوع الملف غير مسموح.');
    return;
  }

  if (file.size > 1024 * 1024) {
    showMessage('حجم الملف أكبر من 1 MB.');
    return;
  }

  const button = $('uploadButton');
  button.disabled = true;
  showMessage('جاري رفع الملف...');

  try {
    const safeName = file.name
      .replace(/[^a-zA-Z0-9._-]/g, '_')
      .slice(-100);

    const path =
      currentUser.id + '/' +
      crypto.randomUUID() + '-' + safeName;

    const { error: uploadError } = await supabase.storage
      .from('exam-excel-files')
      .upload(path, file, {
        contentType: allowedTypes[extension],
        upsert: false
      });

    if (uploadError) throw uploadError;

    const { error: recordError } = await supabase
      .from('exam_uploads')
      .insert({
        file_name: file.name,
        storage_path: path,
        uploaded_by: currentUser.id,
        processing_status: 'pending'
      });

    if (recordError) {
      showMessage(
        'تم رفع الملف إلى التخزين، لكن تعذر تسجيله في قاعدة البيانات: ' +
        recordError.message +
        '\nلا تعيدي الرفع الآن؛ يلزم مراجعة الملف غير المسجل.'
      );
      return;
    }

    showMessage(
      'تم رفع الملف وتسجيله بنجاح.\n' +
      'الحالة: في انتظار معالجة بيانات Excel.'
    );
    $('uploadForm').reset();

  } catch (error) {
    showMessage('تعذر رفع الملف: ' + error.message);
  } finally {
    button.disabled = false;
  }
});

async function showPendingUploads() {
  if (!currentUser) return;

  const area = document.createElement('section');
  area.style.marginTop = '24px';

  const heading = document.createElement('h3');
  heading.textContent = 'ملفات في انتظار المعالجة';
  area.appendChild(heading);

  const list = document.createElement('div');
  area.appendChild(list);
  $('uploadForm').after(area);

  async function refresh() {
    list.textContent = 'جاري تحميل الملفات...';

    const { data, error } = await supabase
      .from('exam_uploads')
      .select('id,file_name,processing_status')
      .eq('processing_status', 'pending')
      .order('uploaded_at', { ascending: false });

    if (error) {
      list.textContent = 'تعذر تحميل الملفات: ' + error.message;
      return;
    }

    list.replaceChildren();

    if (!data?.length) {
      list.textContent = 'لا توجد ملفات في انتظار المعالجة.';
      return;
    }

    for (const upload of data) {
      const item = document.createElement('div');
      item.style.margin = '12px 0';

      const name = document.createElement('span');
      name.textContent = upload.file_name + ' — ';

      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'معالجة وحفظ';

      button.addEventListener('click', async () => {
        if (!confirm('هل تريدين معالجة وحفظ بيانات هذا الملف؟\n' + upload.file_name)) {
          return;
        }

        button.disabled = true;
        button.textContent = 'جاري المعالجة...';

        try {
          const { data: result, error: invokeError } =
            await supabase.functions.invoke('super-task', {
              body: { upload_id: upload.id }
            });

          if (invokeError) {
            const details = await invokeError.context?.json?.()
              .catch(() => null);

            throw new Error(
              details?.error ||
              invokeError.message
            );
          }

          if (!result?.success) {
            throw new Error(result?.error || 'لم تكتمل المعالجة');
          }

          alert(
            'تم الحفظ بنجاح.\n' +
            'عدد السجلات: ' + result.saved_count
          );

          await refresh();
        } catch (error) {
          alert('لم يتم الحفظ: ' + error.message);
          button.disabled = false;
          button.textContent = 'معالجة وحفظ';
        }
      });

      item.append(name, button);
      list.appendChild(item);
    }
  }

  await refresh();
}

await checkAccess();
await showPendingUploads();

await checkAccess();
</script>

</body>
</html>
